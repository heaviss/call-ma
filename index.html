<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link
      rel="icon"
      type="image/png"
      href="/icons/call_ma_icon.webp"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>call-ma</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 16px;
      }

      header {
        margin-bottom: 12px;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .controls {
        display: flex;
        gap: 8px;
        align-items: center;
        flex-wrap: wrap;
      }

      .field {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .videos {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }

      video {
        width: 100%;
        background: #000;
        aspect-ratio: 16/9;
      }

      #logs {
        white-space: pre-wrap;
        background: #f6f6f6;
        padding: 8px;
        border-radius: 6px;
        min-height: 64px;
      }

      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }

      .visually-hidden:focus-visible {
        position: static;
        width: auto;
        height: auto;
        padding: 4px 8px;
        margin: 0;
        overflow: visible;
        clip-path: none;
        white-space: normal;
      }

      @media (width <= 640px) {
        body {
          padding: 0;
        }

        header {
          padding: 12px 16px;
          margin-bottom: 0;
        }

        .videos {
          position: relative;
          display: block;
        }

        .video-wrapper-remote video {
          aspect-ratio: 9/16;
          object-fit: cover;
        }

        .video-wrapper-local {
          position: absolute;
          right: 12px;
          bottom: 12px;
          z-index: 1;
          width: 30%;
        }

        .video-wrapper-local video {
          border-radius: 8px;
          box-shadow: 0 2px 8px rgb(0 0 0 / 0.4);
        }

        .video-label {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <a href="#main" class="visually-hidden">Skip to content</a>
    <header>
      <h1>call-ma</h1>
      <div
        class="controls"
        role="group"
        aria-label="Call controls"
      >
        <button id="createBtn" type="button">Create Conference</button>
        <button
          id="copyBtn"
          type="button"
          disabled
        >Copy Link</button>
      </div>
    </header>
    <main id="main">
      <section class="videos" aria-label="Video">
        <div class="video-wrapper video-wrapper-local">
          <h2 class="video-label">Local</h2>
          <video
            id="localVideo"
            autoplay
            muted
            playsinline
          ></video>
        </div>
        <div class="video-wrapper video-wrapper-remote">
          <h2 class="video-label">Remote</h2>
          <video
            id="remoteVideo"
            autoplay
            playsinline
          ></video>
        </div>
      </section>
      <section
        id="logsSection"
        aria-label="Logs and stats"
        hidden
      >
        <h2>Logs</h2>
        <div id="logs" aria-live="polite"></div>
      </section>
    </main>

    <div id="app" hidden></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
