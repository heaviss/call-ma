<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - call-ma</title>
    <style>
      body {
        padding: 2rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      .card {
        max-inline-size: 480px;
        padding: 1.5rem;
        margin: 0 auto;
        background: #fff;
        border: 1px solid #ddd;
        border-radius: 12px;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.25rem;
      }

      p {
        margin: 0 0 0.5rem;
        color: #444;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>The app is not connected. Please check your network and try again.</p>
    </div>
  </body>
</html>
